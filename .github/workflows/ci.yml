name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet-tests:
    name: App (.NET) Tests
    # macos-latest, not ubuntu: this suite has only ever run on macOS and Hades itself ships
    # macOS-only - portability is unverified, and guessing wrong here costs a day chasing an
    # "Application Support" path assertion instead of whatever this job was meant to catch. Runs
    # directly on the runner VM, deliberately not inside a container: several tests call
    # File.SetUnixFileMode, and root inside a container ignores mode bits, which would make
    # those assertions pass for the wrong reason.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # HADES_HOME must reach EVERY test project: Hades.Server.Tests isolates itself via a
      # [ModuleInitializer] (HadesHomeIsolation.cs) that defers to an already-set value, but
      # Hades.Contract.Tests/Hades.Cli.Tests/Hades.Core.Tests have no such safety net and would
      # otherwise fall back to the runner's real application-data directory.
      #
      # It is exported through $GITHUB_ENV rather than a job-level `env:` block, and that is not a
      # style choice. `jobs.<id>.env` may only use the github/needs/strategy/matrix/vars/secrets/
      # inputs contexts - `runner` is NOT among them, and is available only inside steps. A
      # job-level `HADES_HOME: ${{ runner.temp }}/...` is therefore a workflow VALIDATION error:
      # syntactically valid YAML that GitHub rejects before scheduling anything, which surfaces as
      # a run that fails in 0 seconds with zero jobs and no log to read. This job did exactly that
      # on every run from 2026-08-10 (the commit that introduced it) to 2026-08-20. $RUNNER_TEMP is
      # the same value as a plain environment variable, and is legal here.
      - name: Set up an isolated HADES_HOME
        run: |
          echo "HADES_HOME=$RUNNER_TEMP/hades-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hades-home"

      - uses: actions/setup-dotnet@v4
        with:
          # Pinned to Core/global.json's own SDK (10.0.301, rollForward: latestFeature) rather
          # than a dotnet-version input here - Directory.Build.props sets
          # TreatWarningsAsErrors=true, so a rolled-forward SDK shipping new analyzer warnings
          # would turn this job red for reasons unrelated to whatever it was actually meant to
          # check.
          global-json-file: Core/global.json

      # Honesty note for whoever reads the passing count this job prints: at least nine test
      # files (the RealProject*SmokeTest.cs family - six under Hades.Server.Tests, three under
      # Hades.Core.Tests) plus individual tests inside a few more files (RealCorpusReaderTests.cs,
      # MetaFileReaderTests.cs, PluginInstallerTests.cs) hardcode one developer's own project
      # checkouts under /Users/mike/Projects/... and silently no-op - an early
      # `if (!Directory.Exists(...)) return;` before any assertion - whenever that path is
      # absent, which it always is on this runner. xUnit reports an early return as PASSED, not
      # skipped, so this does not even surface as a skip count. That is by design (see those
      # files' own comments) but it means the number below overstates what this job actually
      # exercised - do not quote it as full coverage of this suite.
      - name: dotnet test
        working-directory: Core
        run: dotnet test
